<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Translator — Caption Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Google Sans", "Noto Sans", "Noto Sans JP", sans-serif; }

    #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }

    #prompt {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1a1a2e; color: #fff; gap: 1.2rem; z-index: 10;
    }
    #prompt h2 { font-size: 1.4rem; font-weight: 500; }
    #prompt p { font-size: 0.95rem; color: #aaa; max-width: 28rem; text-align: center; line-height: 1.5; }
    #prompt .hint { font-size: 0.8rem; color: #777; }
    #prompt button {
      padding: 0.7rem 2rem; font-size: 1rem; border: none; border-radius: 0.5rem;
      background: #4285f4; color: #fff; cursor: pointer;
    }
    #prompt button:hover { background: #3367d6; }
    #prompt.hidden { display: none; }

    #fsBtn {
      position: fixed; top: 1rem; right: 1rem; z-index: 30;
      padding: 0.6rem 1.1rem; font-size: 0.95rem; border: none; border-radius: 0.4rem;
      background: rgba(0, 0, 0, 0.65); color: #fff; cursor: pointer;
      transition: opacity 0.4s ease;
    }
    #fsBtn:hover { background: rgba(0, 0, 0, 0.9); }
    #fsBtn.hidden { display: none; }
    #fsBtn.faded { opacity: 0; pointer-events: none; }

    #lines {
      position: fixed; bottom: 16px; left: 16px; right: 16px;
      overflow: hidden; max-height: calc(100% - 32px);
      display: flex; flex-direction: column; align-items: center;
      gap: 0; pointer-events: none; z-index: 20;
    }

    .line {
      font-size: var(--caption-font-size, 32px); line-height: 1.4; color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 0 12px; flex-shrink: 0; border-radius: 0.4rem;
      max-width: 100%; text-align: center; white-space: pre; overflow: hidden;
      animation: line-in 0.25s ease-out;
    }
    #settings { position: fixed; top: 16px; left: 16px; z-index: 40;
      padding: 12px; border-radius: 6px; background: #202124; color: white; }
    #settings summary { cursor: pointer; }
    #settings label { display: flex; justify-content: space-between; gap: 16px; margin-top: 12px; }
    #settings input { width: 80px; font-size: 16px; }
    #settings p { max-width: 320px; font-size: 13px; margin-top: 12px; }
    #settings.faded { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .line { animation: none; } }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    @keyframes line-in { from { opacity: 0; transform: translateY(0.5rem); } to { opacity: 1; transform: translateY(0); } }
    @keyframes line-out { from { opacity: 1; } to { opacity: 0; } }
  </style>
</head>
<body>
  <video id="video" autoplay muted></video>

  <div id="prompt">
    <h2>Caption Overlay</h2>
    <p>Select a window to mirror. Translated subtitles will appear at the bottom. Share this window on Google Meet.</p>
    <button id="startCapture">Select Window</button>
    <button id="captionsOnly">字幕のみ表示 / Captions only</button>
    <p class="hint">Once mirroring starts, click <b>Fullscreen</b> (or press <b>F</b> / double-click) — <b>Esc</b> exits.</p>
  </div>

  <button id="fsBtn" class="hidden" title="Fullscreen (F)">⛶ Fullscreen</button>

  <details id="settings">
    <summary>字幕設定 / Caption settings</summary>
    <label>1行の最大文字数 <input id="maxChars" type="number" min="5" max="120" step="1"></label>
    <label>最大表示行数（2〜4） <input id="maxLines" type="number" min="2" max="4" step="1"></label>
    <label>フォントサイズ（px） <input id="fontSize" type="number" min="16" max="120" step="1"></label>
    <p>幅に合わせて自動改行し、古い行から切り替えます。設定はこのブラウザに保存されます。Sキーで設定を開閉できます。</p>
  </details>
  <div id="lines" aria-live="off"></div>

  <script type="module">
    import { DEFAULTS, normalizeSettings, visibleRows } from "/static/js/caption-layout.mjs";
    const FADE_DELAY_MS = 8000;
    const video = document.getElementById("video");
    const prompt = document.getElementById("prompt");
    const linesEl = document.getElementById("lines");
    const channel = new BroadcastChannel("live-translator");

    let currentEntry = null;
    let entries = [];
    let captionsOnly = false;
    const settingsEl = document.getElementById("settings");
    const storageKey = "live-translator-caption-settings";
    let settings = { ...DEFAULTS };
    try { settings = normalizeSettings(JSON.parse(localStorage.getItem(storageKey)) || DEFAULTS); } catch {}
    const measureContext = document.createElement("canvas").getContext("2d");
    function applySettings() {
      document.documentElement.style.setProperty("--caption-font-size", `${settings.fontSize}px`);
      for (const key of Object.keys(DEFAULTS)) document.getElementById(key).value = settings[key];
      render();
    }
    for (const key of Object.keys(DEFAULTS)) {
      document.getElementById(key).addEventListener("change", (event) => {
        settings = normalizeSettings({ ...settings, [key]: event.target.value || DEFAULTS[key] });
        try { localStorage.setItem(storageKey, JSON.stringify(settings)); } catch {}
        applySettings();
      });
    }
    window.addEventListener("storage", event => {
      if (event.key !== storageKey) return;
      try { settings = normalizeSettings(JSON.parse(event.newValue) || DEFAULTS); applySettings(); } catch {}
    });
    function render() {
      entries = entries.filter(entry => entry.expires > Date.now());
      measureContext.font = `${settings.fontSize}px ${getComputedStyle(linesEl).fontFamily}`;
      const width = Math.max(1, linesEl.clientWidth - 24);
      const fittedLines = Math.min(settings.maxLines, Math.max(0,
        Math.floor((window.innerHeight - 32) / (settings.fontSize * 1.4))));
      const rows = fittedLines ? visibleRows(entries, { ...settings, maxLines: fittedLines },
        width, text => measureContext.measureText(text).width) : [];
      // Reuse unchanged rows so streaming updates do not restart every animation.
      while (linesEl.children.length > rows.length) linesEl.lastChild.remove();
      rows.forEach((text, i) => {
        let row = linesEl.children[i];
        if (!row) { row = document.createElement("div"); row.className = "line"; linesEl.appendChild(row); }
        if (row.textContent !== text) row.textContent = text;
      });
    }
    applySettings();
    window.addEventListener("resize", render);
    document.fonts.ready.then(render);
    setInterval(render, 500);

    /**
     * Fullscreen.
     *
     * This deliberately does NOT piggyback on the "Select Window" click:
     * requestFullscreen() consumes the transient user activation that
     * getDisplayMedia() also requires, and Chrome's window picker preempts an
     * in-flight fullscreen transition anyway. So the two need separate
     * gestures — hence the floating Fullscreen button shown once mirroring
     * starts (plus the F key and double-click).
     */
    const fsBtn = document.getElementById("fsBtn");
    let fsFadeTimer = null;

    function enterFullscreen() {
      if (document.fullscreenElement) return Promise.resolve();
      const el = document.documentElement;
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) return Promise.resolve();
      return Promise.resolve(req.call(el, { navigationUI: "hide" })).catch(() => {});
    }

    function exitFullscreen() {
      if (!document.fullscreenElement) return Promise.resolve();
      const fn = document.exitFullscreen || document.webkitExitFullscreen;
      if (!fn) return Promise.resolve();
      return Promise.resolve(fn.call(document)).catch(() => {});
    }

    function toggleFullscreen() {
      return document.fullscreenElement ? exitFullscreen() : enterFullscreen();
    }

    /** Show the Fullscreen button, then fade it out so it stays off the slides. */
    function showFsBtn() {
      if (!video.srcObject && !captionsOnly) return;
      settingsEl.classList.remove("faded");
      fsBtn.classList.remove("hidden", "faded");
      clearTimeout(fsFadeTimer);
      fsFadeTimer = setTimeout(() => {
        fsBtn.classList.add("faded");
        if (!settingsEl.open) settingsEl.classList.add("faded");
      }, 4000);
    }

    function hideFsBtn() {
      clearTimeout(fsFadeTimer);
      fsBtn.classList.add("hidden");
    }

    fsBtn.addEventListener("click", () => enterFullscreen());
    document.addEventListener("mousemove", showFsBtn);
    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement) hideFsBtn();
      else showFsBtn();
    });

    document.getElementById("captionsOnly").addEventListener("click", () => {
      captionsOnly = true;
      prompt.classList.add("hidden");
      showFsBtn();
    });

    document.getElementById("startCapture").addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { cursor: "always" },
          audio: false,
          preferCurrentTab: false,
        });
        video.srcObject = stream;
        prompt.classList.add("hidden");
        showFsBtn();
        stream.getVideoTracks()[0].addEventListener("ended", () => {
          video.srcObject = null;
          prompt.classList.remove("hidden");
          hideFsBtn();
          exitFullscreen();
        });
      } catch {
        // User cancelled the picker
      }
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.closest("input, button, summary")) return;
      if (e.key.toLowerCase() === "f") toggleFullscreen();
      if (e.key.toLowerCase() === "s") {
        settingsEl.classList.remove("faded");
        settingsEl.open = !settingsEl.open;
        showFsBtn();
      }
    });
    document.addEventListener("dblclick", e => {
      if (!e.target.closest("#settings, button")) toggleFullscreen();
    });
    settingsEl.addEventListener("toggle", showFsBtn);

    function finalize() {
      if (currentEntry) currentEntry.expires = Date.now() + FADE_DELAY_MS;
      currentEntry = null;
      render();
    }

    channel.onmessage = (e) => {
      const msg = e.data;
      if (msg.type === "outputTranscription" && typeof msg.text === "string") {
        if (!currentEntry) {
          currentEntry = { text: "", expires: Infinity };
          entries.push(currentEntry);
          entries = entries.slice(-4);
        }
        currentEntry.text = msg.text;
        if (msg.finished) finalize();
        else render();
      } else if (msg.type === "turnComplete" || msg.type === "disconnected") {
        finalize();
      } else if (msg.type === "connected") {
        entries = [];
        currentEntry = null;
        render();
      }
    };
  </script>
</body>
</html>
